{% block content %}
<div style="display: flex; min-height: 100vh; font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background-color: #0f172a;">
  
  <!-- LEFT SIDE: Clean Graduation Image Panel (Takes up exactly 60% width) -->
  <div style="flex: 60; background-size: cover; background-position: center; background-image: url('https://unsplash.com');">
  </div>

  <!-- RIGHT SIDE: Clean Sign-In Form Portal (Takes up exactly 40% width) -->
  <div style="flex: 40; display: flex; align-items: center; justify-content: center; padding: 48px; background-color: #ffffff;">
    <div style="width: 100%; max-w: 360px;">
      
      <!-- BRANDING & HEADERS BRAND NEW LAYOUT -->
      <div style="text-align: center; margin-bottom: 32px;">
        <h1 style="font-size: 2.5rem; font-weight: 800; color: #0f172a; margin: 0 0 8px 0; letter-spacing: -0.03em;">EduMentor</h1>
        <h3 style="font-size: 1.25rem; font-weight: 600; color: #475569; margin: 0; letter-spacing: -0.025em;">Sign in to your account</h3>
        <p style="font-size: 0.875rem; color: #64748b; margin-top: 4px;">Welcome back! Please enter your portal details below.</p>
      </div>

      {% if error %}
      <div style="background-color: #fef2f2; border-left: 4px solid #f87171; padding: 16px; border-radius: 6px; font-size: 0.875rem; color: #b91c1c; margin-bottom: 24px; font-weight: 500;">
        {{ error }}
      </div>
      {% endif %}

      <!-- FORM ACTIONS AND BACKEND LOGIC -->
      <form method="POST" style="display: flex; flex-direction: column; gap: 20px;">
        
        <!-- USERNAME INPUT -->
        <div>
          <label style="display: block; font-size: 0.875rem; font-weight: 600; color: #334155; margin-bottom: 6px;">Username</label>
          <input type="text" name="username" value="faculty1" required style="width: 100%; box-sizing: border-box; padding: 12px 16px; border-radius: 8px; border: 1px solid #cbd5e1; font-size: 0.875rem; color: #0f172a; background-color: #f8fafc;">
        </div>

        <!-- PASSWORD INPUT -->
        <div>
          <label style="display: block; font-size: 0.875rem; font-weight: 600; color: #334155; margin-bottom: 6px;">Password</label>
          <input type="password" name="password" required style="width: 100%; box-sizing: border-box; padding: 12px 16px; border-radius: 8px; border: 1px solid #cbd5e1; font-size: 0.875rem; color: #0f172a; background-color: #f8fafc;">
        </div>

        <!-- SUBMIT ACTION -->
        <button type="submit" style="width: 100%; padding: 14px 16px; border-radius: 8px; border: none; background-color: #065f46; color: #ffffff; font-size: 0.9rem; font-weight: 600; cursor: pointer;">
          Log In
        </button>
      </form>

      <!-- REGISTRATION FOOTER -->
      <p style="font-size: 0.875rem; color: #475569; margin-top: 36px; text-align: center;">
        New student? <a href="#" style="font-weight: 600; color: #065f46; text-decoration: none;">Register here</a>
      </p>

    </div>
  </div>

</div>
{% endblock %}
